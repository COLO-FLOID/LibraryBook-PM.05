<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="wrapper">

    <div class="sidebar">
        <h2>LibraryBook</h2>

        <a href="/admin">Заявки пользователей</a>
        <a href="/">Выход</a>
    </div>

    <div class="main">

        <div class="header">
            <h1>Панель администратора</h1>
            <p>Просмотр заявок пользователей и изменение статусов</p>
        </div>

        <div class="card">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Пользователь</th>
                        <th>Книга</th>
                        <th>Автор</th>
                        <th>Статус</th>
                        <th>Дата</th>
                        <th>Изменить статус</th>
                        <th>Удаление</th>
                    </tr>
                </thead>

                <tbody id="applicationsTable"></tbody>
            </table>

            <div id="message"></div>

        </div>

    </div>

</div>

<script>

const userId = localStorage.getItem('user_id');
const roleId = localStorage.getItem('role_id');

if(!userId){
    window.location.href = "/";
}

if(roleId != 1){
    window.location.href = "/books";
}

function deleteApplication(id){

    if(!confirm("Удалить заявку?")){
        return;
    }

    fetch(`/api/admin/applications/${id}`, {

        method:'DELETE'

    })

    .then(response => response.json())

    .then(data => {

        let msg = document.getElementById('message');

        msg.className = 'message';

        msg.innerText = data.message;

        loadApplications();

    });

}

function loadApplications(){

    fetch('/api/admin/applications')

    .then(response => response.json())

    .then(applications => {

        let table = document.getElementById('applicationsTable');

        table.innerHTML = '';

        applications.forEach(application => {

            table.innerHTML += `
                <tr>
                    <td>${application.id}</td>
                    <td>${application.full_name}</td>
                    <td>${application.title}</td>
                    <td>${application.author}</td>
                    <td>
                        <span class="status">
                            ${application.status}
                        </span>
                    </td>
                    <td>
                        ${new Date(application.created_at)
                            .toLocaleString('ru-RU')}
                    </td>
                    <td>
                        <select onchange="changeStatus(${application.id}, this.value)">
                            <option value="">Выбрать статус</option>
                            <option value="1">Новая</option>
                            <option value="2">Подтверждена</option>
                            <option value="3">Выдана</option>
                            <option value="4">Возвращена</option>
                            <option value="5">Отменена</option>
                        </select>
                    </td>
                    <td>
                        <button class="small-btn"
                                onclick="deleteApplication(${application.id})">
                            Удалить
                        </button>
                    </td>
                </tr>
            `;

        });

    });

}

function changeStatus(id, statusId){

    if(!statusId){
        return;
    }

    fetch(`/api/admin/applications/${id}/status`, {

        method:'PATCH',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            status_id:statusId
        })

    })

    .then(response => response.json())

    .then(data => {

        let msg = document.getElementById('message');

        msg.className = 'message';

        msg.innerText = data.message;

        loadApplications();

    });

}

loadApplications();

</script>

</body>
</html>
